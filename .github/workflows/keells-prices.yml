# Keeps Keells prices current.
#
# Prices only move when a promotion starts or ends, so this does not re-ask for
# the whole catalogue. Each night it re-checks everything currently ON
# promotion (those expire, and a finished discount is the one error a shopper
# actually notices) plus the least recently checked rows, up to a budget. Every
# price comes round on a rotation of roughly a week, and a night's traffic is a
# few minutes of four-at-a-time requests.
#
# 22:00 UTC is 03:30 in Colombo - the middle of the night where the shop is,
# which is the point.
name: Refresh Keells prices

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'How many products to re-check (0 = only ones never fetched)'
        default: '1200'

permissions:
  contents: write

concurrency:
  group: keells-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-check promotions and the oldest prices
        run: |
          python tools/fetch_keells_prices.py \
            tools/fixtures/keells-catalogue-sitemap.json \
            tools/fixtures/keells-catalogue-priced.json \
            --refresh=${{ inputs.budget || '1200' }}

      - name: Rebuild the barcode price join
        run: |
          python tools/match_keells.py scanner/data/barcodes.json \
            "tools/fixtures/keells-catalogue-priced.json,tools/fixtures/keells-catalogue.json,tools/fixtures/keells-catalogue-sitemap.json" \
            scanner/data/prices.json

      # A catalogue that suddenly halved means the source had a bad night, not
      # that the shop closed. Shipping that would quietly unprice the scanner
      # mid-shop, so fail instead and keep what is already committed.
      - name: Refuse a catalogue that shrank
        run: |
          python - <<'PY'
          import json, subprocess, sys
          new = json.load(open('scanner/data/prices.json', encoding='utf-8'))['count']
          old = subprocess.run(['git', 'show', 'HEAD:scanner/data/prices.json'],
                               capture_output=True, text=True)
          prev = json.loads(old.stdout)['count'] if old.returncode == 0 else 0
          print(f'priced barcodes: was {prev}, now {new}')
          if prev and new < prev * 0.9:
              sys.exit(f'refusing: dropped from {prev} to {new}')
          PY

      - name: Commit if any price moved
        run: |
          if git diff --quiet -- scanner/data/prices.json tools/fixtures/keells-catalogue-priced.json; then
            echo "no price changes"
            exit 0
          fi
          N=$(python -c "import json;print(json.load(open('scanner/data/prices.json',encoding='utf-8'))['count'])")
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scanner/data/prices.json tools/fixtures/keells-catalogue-priced.json
          git commit -m "data: Keells prices refreshed (${N} priced barcodes)"
          git push
